    text: Felicitaciones, yo me dedico al bienestar emocional mental de los humanos.Ahora bien {nombre}, quiero hablarte de la forma en la que te voy a ayudar; soy un acompañante virtual el cual se enfoca en la terapia cognitivo conductual, si quieres saber más acerca de ella selecciona la opción ? y ahí podrás informarte
