    text: ¿{nombre}, sabes el significado del concepto de estrés académico?
  utter_response_10:
  - buttons:
    - payload: '/afirmativo'
      title: Oh entiendo
    text: Entonces {nombre}, Segun C, Ferrera y  S, Bárcenas (2016) el estrés académico es un proceso sistémico, de carácter adaptativo y esencialmente psicológico, se evidencia  bajo la valoración del propio alumno considerado situaciones  estresoras; cuando estos estresores provocan un desequilibrio sistemático (situación estresante) que se manifiesta en una serie de síntomas (indicadores del desequilibrio); y cuando este desequilibrio obliga al alumno a realizar acciones de afrontamiento para restaurar el equilibrio sistémico
  utter_ask_11:
  - text: Quieres compartirme sobre lo que has sentido últimamente, en la universidad o con tus equipos de trabajo?
  utter_response_11:
  - buttons:
